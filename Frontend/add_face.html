<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchmanX - Enroll Face</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      width: 100vw;
      background-color: #020817;
      background-image: url('https://res.cloudinary.com/ygllvtyg/image/upload/v1787514601/blue_light_gradient_by_EvgeniyZemelko_fyi1s6.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    .navbar {
      width: 100%;
      height: 70px;
      background: rgba(10, 17, 32, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(38, 64, 102, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .brand-x {
      font-size: 30px;
      font-weight: 900;
      color: #38bdf8;
      margin-left: 2px;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.85);
    }
    .nav-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #cbd5e1;
      text-decoration: none;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      background: rgba(15, 23, 42, 0.6);
    }
    .nav-btn:hover {
      background: #0ea5e9;
      color: #fff;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
    }
    .main-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.94) 0%, rgba(10, 17, 32, 0.96) 100%);
      border: 1px solid rgba(38, 64, 102, 0.7);
      border-radius: 24px;
      padding: 2.8rem 2.2rem 2.2rem;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85), 0 0 50px rgba(14, 165, 233, 0.15);
      position: relative;
    }
    .sub-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #64748b;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .field-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .input-box {
      width: 100%;
      background: rgba(13, 22, 38, 0.95);
      border: 1px solid rgba(30, 58, 95, 0.7);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-box:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
    }
    .scan-notice {
      background: rgba(14, 165, 233, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 0.2rem;
    }
    .scan-notice strong {
      color: #38bdf8;
      display: block;
      margin-bottom: 4px;
      font-family: 'Montserrat', sans-serif;
    }
    .btn-submit {
      width: 100%;
      margin-top: 0.8rem;
      padding: 1rem;
      background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.45);
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background: linear-gradient(180deg, #38bdf8 0%, #0369a1 100%);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.65);
      transform: translateY(-1px);
    }
    .bottom-bar { padding: 1rem; }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="/Frontend/home.html" class="brand-title">WATCHMAN<span class="brand-x">X</span></a>
    <a href="/Frontend/home.html" class="nav-btn">Home</a>
  </header>

  <main class="main-container">
    <div class="card">
      <div class="sub-title">CORE IDENTITY ENROLLMENT</div>

      <form action="/api/scan-and-register" method="POST" class="auth-form">
        <div>
          <label class="field-label" for="person_name">PERSON FULL NAME</label>
          <input type="text" id="person_name" name="person_name" class="input-box" placeholder="e.g. Guru" required autocomplete="off" />
        </div>

        <div>
          <label class="field-label" for="details">ROLE / REMARKS</label>
          <input type="text" id="details" name="details" class="input-box" placeholder="Collegemate" required autocomplete="off" />
        </div>

        <div class="scan-notice">
          <strong>OPTICAL SENSOR SCAN</strong>
          Look directly at your laptop webcam after clicking below. The GoCV engine will capture and extract face embeddings directly.
        </div>

        <button type="submit" class="btn-submit">TRIGGER SCAN & ENROLL</button>
      </form>
    </div>
  </main>

  <footer class="bottom-bar"></footer>

</body>
</html>
